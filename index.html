<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mă angajezi?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap">
<style>
:root{
  --bg:#E9ECFF; --ink:#14142B; --muted:#5A5C86; --yes:#12A05C; --no:#E5383B; --card:#FFFFFF;
  --f:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#12122A;--ink:#F1F1FF;--muted:#A3A6D6;--card:#1E1F42;}
}
:root[data-theme="dark"]{--bg:#12122A;--ink:#F1F1FF;--muted:#A3A6D6;--card:#1E1F42;}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f);
  display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
main{width:100%;max-width:560px;text-align:center}
.badge{display:inline-block;background:var(--card);color:var(--ink);border:3px solid var(--ink);
  border-radius:12px;padding:8px 18px;font-weight:800;font-size:1.05rem;transform:rotate(-3deg);margin-bottom:26px}
.badge small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
h1{font-size:clamp(2.4rem,11.5vw,4.4rem);line-height:1;margin:0 0 30px;font-weight:800;letter-spacing:-.03em;min-height:2.1em;
  display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap}
button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--f);font-weight:800;border:3px solid var(--ink);border-radius:18px;color:#fff;
  cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;touch-action:manipulation}
button:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#yes{background:var(--yes);font-size:calc(1.8rem * var(--ys,1));padding:.55em 1.4em;min-height:64px;min-width:112px}
#no{background:var(--no);font-size:calc(1.8rem * var(--ns,1));padding:.55em 1.4em;transition:transform .18s;min-height:52px;min-width:96px}
.huge #yes{flex:1 1 100%;padding:1.1em 1em}
#count{margin-top:28px;color:var(--muted);font-size:1rem;min-height:1.4em}
#title{display:none;margin:12px auto 0;background:var(--card);color:var(--ink);border:3px solid var(--ink);
  border-radius:12px;padding:8px 16px;font-weight:800;transform:rotate(2deg)}
#msg{margin:0;font-size:1.25rem;font-weight:500}
#reset{display:none;margin-top:22px;background:var(--card);color:var(--ink);font-size:1rem;padding:.6em 1.2em}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-12px) rotate(-1deg)}40%{transform:translateX(10px) rotate(1deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.conf{position:fixed;top:-40px;font-size:2rem;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.9}}

#scare{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;background:rgba(0,0,0,.88)}
#scare.on{display:flex}
#scare span{font-size:44vmin;line-height:1;animation:zoom .8s ease-out forwards}
#scare img{max-width:82vw;max-height:78vh;border-radius:16px;animation:zoom .8s ease-out forwards}
@keyframes zoom{0%{transform:scale(.15) rotate(-10deg)}30%{transform:scale(1.18) rotate(3deg)}100%{transform:scale(1) rotate(0)}}

#contract{display:none;background:#FFFEF7;color:#222;border:3px solid var(--ink);border-radius:6px;
  padding:20px 20px 16px;text-align:left;font-size:1rem;line-height:1.6;margin-bottom:6px;transform:rotate(-1deg)}
#contract h2{margin:0 0 8px;font-size:1.15rem;text-align:center;letter-spacing:.02em}
#contract p{margin:0}
#sig{width:100%;height:90px;border-bottom:2px solid #222;background:transparent;touch-action:none;display:block;margin-top:6px}
#signote{font-size:.9rem;color:#555;min-height:1.3em;margin-top:6px}

@media (max-height:700px){
  .badge{margin-bottom:14px;padding:6px 14px}
  h1{margin-bottom:18px;min-height:1.7em}
  #count{margin-top:16px}
  #contract{padding:14px 16px 10px;line-height:1.45}
  #sig{height:70px}
  #reset{margin-top:12px}
}
@media (max-height:520px) and (orientation:landscape){
  body{align-items:flex-start}
  h1{font-size:clamp(1.5rem,7vh,2.4rem);min-height:1.3em;margin-bottom:12px}
  .badge{margin-bottom:10px}
  #yes,#no{font-size:1.3rem;min-height:48px}
  .huge #yes{flex:1 1 60%}
}
@media (prefers-reduced-motion:reduce){
  .shake,#scare span,#scare img{animation:none}
  .conf{animation-duration:.01s!important}
  #no{transition:none}
}
</style>
</head>
<body>
<main id="app">
  <div class="badge">Angajeăză-l pe Tudor</div>
  <h1 id="q" aria-live="polite">Mă angajezi?</h1>
  <div class="row" id="btns">
    <button id="yes" type="button">DA</button>
    <button id="no" type="button">NU</button>
  </div>
  <div id="contract">
    <h2>CONTRACT DE MUNCĂ</h2>
    <p>Angajator: tu, șefu’.</p>
    <p>Angajat: Tudor.</p>
    <p>Salariu: competitiv.</p>
    <p>Data începerii: cât mai târziu.</p>
    <p>Semnează cu degetul:</p>
    <canvas id="sig"></canvas>
    <div id="signote"></div>
  </div>
  <p id="msg" aria-live="polite"></p>
  <div id="count"></div>
  <div id="title"></div>
  <button id="reset" type="button">Ia-o de la capăt</button>
</main>

<div id="scare" aria-hidden="true"></div>

  // Pozele tale pentru jumpscare (data: URI sau nume de fișier). Gol = fețe emoji.
  var PHOTOS = [];

  var ctx=null;
  function ac(){
    try{
      if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();}
      if(ctx.state==='suspended'){ctx.resume();}
    }catch(e){}
    return ctx;
  }
  function note(f,t,d,type,vol){
    var c=ac(); if(!c)return;
    var o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,c.currentTime+t);
    g.gain.exponentialRampToValueAtTime(vol,c.currentTime+t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+t+d);
    o.connect(g);g.connect(c.destination);
    o.start(c.currentTime+t);o.stop(c.currentTime+t+d+0.05);
  }
  function fanfare(){
    [523,659,784,1047,784,1047].forEach(function(f,i){note(f,i*0.11,0.22,'square',0.12);});
    note(1319,0.7,0.5,'triangle',0.2);
  }
  function synthFaahh(){
    var c=ac(); if(!c)return;
    var now=c.currentTime,dur=1.1;
    var g=c.createGain(),lp=c.createBiquadFilter();
    lp.type='lowpass';
    lp.frequency.setValueAtTime(2200,now);
    lp.frequency.exponentialRampToValueAtTime(350,now+dur);
    g.gain.setValueAtTime(0.0001,now);
    g.gain.exponentialRampToValueAtTime(0.35,now+0.05);
    g.gain.setValueAtTime(0.35,now+0.5);
    g.gain.exponentialRampToValueAtTime(0.0001,now+dur);
    lp.connect(g);g.connect(c.destination);
    [1,1.006].forEach(function(det){
      var o=c.createOscillator();o.type='sawtooth';
      o.frequency.setValueAtTime(380*det,now);
      o.frequency.exponentialRampToValueAtTime(95*det,now+dur);
      var lfo=c.createOscillator(),lg=c.createGain();
      lfo.frequency.value=7;lg.gain.value=9;
      lfo.connect(lg);lg.connect(o.frequency);
      o.connect(lp);o.start(now);o.stop(now+dur+0.05);
      lfo.start(now);lfo.stop(now+dur+0.05);
    });
  }
  var custom=null;
  if(FAAH_SRC){try{custom=new Audio(FAAH_SRC);custom.preload='auto';}catch(e){custom=null;}}
  function faahh(){
    ac();
    if(custom){
      try{
        custom.pause();custom.currentTime=0;
        var p=custom.play();
        if(p&&p.catch){p.catch(synthFaahh);}
        return;
      }catch(e){}
    }
    synthFaahh();
  }

  var qs=[
    "Mă angajezi?",
    "Dar la jumătate de normă?",
    "Dar pe un burger?",
    "Dar dacă fac și cafeaua?",
    "Dar dacă îți fac și cravata?",
    "Dar dacă sunt disponibil imediat?",
    "Dar dacă plătești doar prima bere?",
    "Ultima întrebare. Serios. Mă angajezi?"
  ];
  var tail=[
    "Bine, mai încerc o dată. Mă angajezi?",
    "Pot sta aici toată seara. Mă angajezi?",
    "Hai că știu că vrei. Mă angajezi?"
  ];
  var faces=["😭","🥺","😩","😵","😖","😿","🤡"];
  var titles={};

  function $(id){return document.getElementById(id);}
  var q=$('q'),yes=$('yes'),no=$('no'),btns=$('btns'),msg=$('msg'),cnt=$('count'),ttl=$('title'),
      rs=$('reset'),app=$('app'),scare=$('scare'),
      contract=$('contract'),sig=$('sig'),signote=$('signote');
  var n=0,busy=false,dodged=false,tx=0,ty=0,titleText='';

  function confetti(){
    var e=['🎉','💼','🎊','💰','👔','🍔','🍺'];
    for(var i=0;i<36;i++){
      var s=document.createElement('span');
      s.className='conf';
      s.textContent=e[i%e.length];
      s.style.left=Math.random()*100+'vw';
      s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
      s.style.animationDelay=(Math.random()*0.4)+'s';
      document.body.appendChild(s);
      setTimeout(function(el){el.remove();},4200,s);
    }
  }
  function ask(){
    q.textContent=n<qs.length?qs[n]:tail[(n-qs.length)%tail.length];
  }
  function update(){
    document.body.style.setProperty('--ys',Math.min(1+n*0.2,2.2));
    document.body.style.setProperty('--ns',Math.max(1-n*0.1,0.55));
    no.textContent=n>=7?'Poate':'NU';
    app.classList.toggle('huge',n>=9);
    cnt.textContent=n===0?'':(n===1?'Ai refuzat un candidat o dată.':'Ai refuzat un candidat de '+n+' ori.');
    var t='';
    [5,8,12].forEach(function(k){if(n>=k)t=titles[k];});
    titleText=t;
    ttl.style.display=t?'inline-block':'none';
    ttl.textContent=t?'🏅 '+t:'';
  }
  function moveNo(){
    var r=no.getBoundingClientRect();
    var nl=8+Math.random()*Math.max(0,window.innerWidth-r.width-16);
    var nt=r.top+(Math.random()-0.5)*180;
    nt=Math.max(8,Math.min(window.innerHeight-r.height-8,nt));
    tx+=nl-r.left;ty+=nt-r.top;
    no.style.transform='translate('+tx+'px,'+ty+'px)';
  }
  no.addEventListener('pointerdown',function(){
    dodged=false;
    if(n>=4&&Math.random()<0.55){dodged=true;moveNo();}
  });
  function showScare(){
    scare.innerHTML='';
    if(PHOTOS.length){
      var im=document.createElement('img');
      im.src=PHOTOS[(n-1)%PHOTOS.length];im.alt='';
      scare.appendChild(im);
    }else{
      var sp=document.createElement('span');
      sp.textContent=faces[(n-1)%faces.length];
      scare.appendChild(sp);
    }
    scare.classList.add('on');
    setTimeout(function(){scare.classList.remove('on');busy=false;},780);
  }
  no.addEventListener('click',function(){
    if(dodged){dodged=false;return;}
    if(busy)return;
    busy=true;
    n++;
    faahh();
    try{if(navigator.vibrate)navigator.vibrate(180);}catch(e){}
    app.classList.remove('shake');void app.offsetWidth;app.classList.add('shake');
    ask();update();showScare();
  });

  function initSig(){
    var dpr=window.devicePixelRatio||1;
    sig.width=sig.clientWidth*dpr;sig.height=sig.clientHeight*dpr;
    var c=sig.getContext('2d');
    c.scale(dpr,dpr);c.lineWidth=2.5;c.lineCap='round';c.strokeStyle='#222';
    var drawing=false,signed=false;
    function pos(e){var r=sig.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
    sig.onpointerdown=function(e){drawing=true;var p=pos(e);c.beginPath();c.moveTo(p[0],p[1]);try{sig.setPointerCapture(e.pointerId);}catch(x){}};
    sig.onpointermove=function(e){if(!drawing)return;var p=pos(e);c.lineTo(p[0],p[1]);c.stroke();};
    sig.onpointerup=function(){
      drawing=false;
      if(!signed){signed=true;signote.textContent='Semnat. Valabil juridic, cam deloc.';}
    };
  }

  yes.addEventListener('click',function(){
    fanfare();confetti();
    q.textContent='Mulțumesc, șefu’!';
    btns.style.display='none';
    contract.style.display='block';
    msg.textContent='Contract semnat. Presiune în bată.';
    cnt.textContent=n>0?'Ai cedat după '+n+(n===1?' refuz.':' refuzuri.'):'Din prima. Respect.';
    rs.style.display='inline-block';
    initSig();
  });
  rs.addEventListener('click',function(){
    n=0;tx=0;ty=0;no.style.transform='';
    ask();update();
    btns.style.display='flex';contract.style.display='none';signote.textContent='';
    msg.textContent='';rs.style.display='none';
  });
})();
</script>
